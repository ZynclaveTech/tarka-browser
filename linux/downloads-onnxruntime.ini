# ONNX Runtime for Linux x64 (L1): Microsoft's official release, MIT
# licensed, the same version as the Mac and Windows builds.
# components/tark_captions compiles against include/ on every desktop;
# live captions load lib/ at run time once they come to Linux (L2).
[onnxruntime]
version = 1.31.0
url = https://github.com/microsoft/onnxruntime/releases/download/v%(version)s/onnxruntime-linux-x64-%(version)s.tgz
download_filename = onnxruntime-linux-x64-%(version)s.tgz
sha256 = cc5c72baf5ae5c8238a6841f0897227be2d02826b9cf98eaf02fdefaeeb03a57
output_path = third_party/tark_onnxruntime
strip_leading_dirs = onnxruntime-linux-x64-%(version)s
