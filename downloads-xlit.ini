# D1 on-device transliteration: AI4Bharat IndicXlit (en -> 21 Indian scripts).
# Retrieved into build/download_cache by utils/install_xlit.sh and NEVER
# unpacked: the checkpoint is a torch zip that downloads.py unpack would try
# to extract. utils/xlit_convert.py reads it directly and writes the TXLM
# blob. output_path is only here because downloads.py's schema requires it. Weights and code are MIT, Copyright (c) 2022 AI4Bharat
# (resources/indicxlit/). All three files are pinned to one Hugging Face commit.
# The download_filename values are also named in utils/install_xlit.sh.

