  complete:
    name: Finished
    needs: [build-1, build-2, build-3, build-4, build-5, build-6, build-7, build-8, build-9, build-10, build-11, build-12, build-13, build-14, build-15, build-16]
    if: ${{ always() && inputs.verify_run == '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: A stage finished the build
        env:
          FINISHED: ${{ contains(toJSON(needs.*.outputs.finished), 'true') }}
        run: |
          if [ "$FINISHED" != "true" ]; then
            echo "No stage finished the build."
            exit 1
          fi

  verify:
    name: Check the build
    needs: [complete]
    if: ${{ !cancelled() && (needs.complete.result == 'success' || inputs.verify_run != '') }}
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Line endings as committed
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Tark for Windows
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: tark-windows-x64
          path: C:\tw\build
          run-id: ${{ inputs.verify_run || github.run_id }}
          github-token: ${{ github.token }}
