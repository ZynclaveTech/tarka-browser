# Generated by windows/ci/gen_workflow.py; edit that, then rerun it.
#
# Tark for Windows x64 (W2) on GitHub's free runners: ONNX Runtime first,
# then up to 16 stages of the Chromium build, each handing the source
# tree to the next, as upstream ungoogled-chromium-windows builds (BSD-3).
name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - feat/w2-windows-parity

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  onnxruntime:
    name: ONNX Runtime (static C runtime)
    runs-on: windows-2022
    timeout-minutes: 300
