        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: C:\ort-out
          key: onnxruntime-1.31.0-402979a-static-${{ hashFiles('windows/ci/build_onnxruntime.ps1') }}
      - name: Build ONNX Runtime 1.31.0
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: windows\ci\build_onnxruntime.ps1 -Out C:\ort-out
      - name: Check it needs no C runtime
        shell: pwsh
        run: windows\ci\build_onnxruntime.ps1 -Out C:\ort-out -CheckOnly
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: onnxruntime-win-x64
          path: C:\ort-out
          retention-days: 7

  build-1:
    name: Build, stage 1
    needs: onnxruntime
    runs-on: windows-2022
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.build.outputs.finished }}
    steps:
      - name: Line endings as committed
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
