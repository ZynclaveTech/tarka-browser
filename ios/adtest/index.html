<!doctype html><meta name=viewport content="width=device-width"><title>adtest</title>
<style>body{font:20px -apple-system;padding:20px} .r{margin:6px 0}</style>
<h2>Tark ad-block test</h2><div id=out></div>
<ins class="adsbygoogle" data-ad-client="ca-pub-1" style="display:block;background:#f99;padding:10px">AD: ins.adsbygoogle visible</ins>
<div class="Ad-Container" style="background:#fc9;padding:10px">AD: .Ad-Container visible (case test)</div>
<script>
const out=document.getElementById('out');
function row(name,ok){const d=document.createElement('div');d.className='r';d.textContent=name+': '+ok;out.appendChild(d)}
const tests=[['script','https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js','adsbygoogle.js'],
['script','https://www.googletagservices.com/tag/js/gpt.js','googletagservices gpt.js'],
['script','https://securepubads.g.doubleclick.net/tag/js/gpt.js','doubleclick gpt.js'],
['img','https://en.wikipedia.org/static/images/icons/wikipedia.png','wikipedia.png (must load)']];
for(const [t,u,n] of tests){const e=document.createElement(t);e.src=u;e.onload=()=>row(n,'LOADED');e.onerror=()=>row(n,'BLOCKED');document.body.appendChild(e)}
setTimeout(()=>{for(const q of ['ins.adsbygoogle','.Ad-Container']){const e=document.querySelector(q);row(q+' element',getComputedStyle(e).display==='none'?'HIDDEN':'VISIBLE')}},4000);
</script>
