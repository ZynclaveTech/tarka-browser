#
# Tark for iOS's in-app ad blocker: the adblock-rust Tark for Android ships,
# behind a small C interface, for what WebKit's content blockers cannot do —
# hiding page elements (with per-site exceptions) and scriptlets. Network
# blocking stays in WebKit (listtool webkit). Built by ios/build.py engine.
[package]
name = "tark-adblock-ios"
version = "1.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
# Keep in step with android/adblock/listtool, which serializes the engine
# this library loads: the flatbuffer format must match exactly.
adblock = { version = "=0.13.3", default-features = false, features = ["full-regex-handling", "single-thread", "embedded-domain-resolver"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
