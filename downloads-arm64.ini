# arm64 (Apple Silicon) specific dependencies not included in the main Chromium source archive

# Pre-built LLVM toolchain for convenience
[llvm]
version = 23.1.0
url = https://github.com/iXORTech/llvm-macos-buildbot/releases/download/%(version)s-arm64/clang+llvm-%(version)s-arm64-apple-darwin24.0.tar.xz
download_filename = clang+llvm-%(version)s-arm64-apple-darwin24.0.tar.xz
strip_leading_dirs = clang+llvm-%(version)s-arm64-apple-darwin24.0
sha512 = 8a19a4246feb12c956a04cad40c009f44505caa63c3c354ab8326eaf691ec805cae393d67aab48b1b4ddad7a7ad51829a1ae2cd6b656be0aff98cd537b4b4c98
output_path = third_party/llvm-build/Release+Asserts

[nodejs]
version = 24.12.0
url = https://nodejs.org/dist/v%(version)s/node-v%(version)s-darwin-arm64.tar.xz
download_filename = node-v%(version)s-darwin-arm64.tar.xz
strip_leading_dirs = node-v%(version)s-darwin-arm64
sha512 = cd6b64563c73c4b482b557ab6715f513a1edde1fd05c33718d3bc0ab2361701b932953334c7fa07246f935dc5e36e74c10cb86d98ef59a6ac745b9f889e3bdcd
output_path = third_party/node/mac_arm64/node-darwin-arm64

[rust]
version = 2026-09-09
url = https://static.rust-lang.org/dist/%(version)s/rust-nightly-aarch64-apple-darwin.tar.xz
download_filename = rust-nightly-%(version)s-aarch64-apple-darwin.tar.xz
output_path = third_party/rust-toolchain
strip_leading_dirs = rust-nightly-aarch64-apple-darwin

# TypeScript Native Preview (tsgo): Chromium 156 compiles WebUI and DevTools
# with it from third_party/typescript/<host>/src (third_party/typescript/
# tsgo.gni), a CIPD package not in the source tarball. The upstream release
# of the version DEPS pins (version:2@<version>) stands in for it, as on
# Windows; fix-typescript-lib-dom.patch makes Chromium's lib.dom.d.ts change.
[typescript]
version = 7.0.2
url = https://github.com/microsoft/TypeScript/releases/download/v%(version)s/typescript-darwin-arm64.tgz
download_filename = typescript-darwin-arm64-%(version)s.tgz
sha512 = 828c336abf4cc12fda456a7a7f76b8294ab34630198ceb2618d08ce8b713817ba6f9d05f82c05530df8082f38209b82e5f289c93a2c986906ccf131e6c9f2cc8
output_path = third_party/typescript/mac-arm64/src
strip_leading_dirs = package
