#
# Tark's adblock list tool (A2): assembles uBlock Origin's redirect resources
# and checks a list bundle by compiling it with exactly the adblock-rust the
# browser ships. Runs on the Mac, the build machine and the daily job; never
# part of the browser.
[package]
name = "listtool"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
# Keep in step with the browser (android/adblock/crates.lock); the browser's
# features plus the resource assembler, the bundled domain resolver and the
# WebKit content-blocking conversion (Tark for iOS).
adblock = { version = "=0.13.3", default-features = false, features = ["full-regex-handling", "single-thread", "resource-assembler", "embedded-domain-resolver", "content-blocking"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
