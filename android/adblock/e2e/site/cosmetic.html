<!doctype html>
<meta charset="utf-8">
<title>running</title>
<script>
// The page's first script: the scriptlets must have run before it.
window.firstScriptSaw = String(window.tarkTestFlag);
window.firstScriptSawTrusted = String(window.tarkTrustedFlag);
</script>
<!-- A2 hiding and scriptlet cases; results go to the title as JSON for run.py. -->
<div class="tark-test-ad" id="specific">a site-specific hide rule</div>
<script>
const results = {
  scriptlet: firstScriptSaw === 'true' ? 'ran' : 'missing',
  trusted: firstScriptSawTrusted === 'yes' ? 'ran' : 'missing',
};
results.specific = getComputedStyle(document.getElementById('specific')).display === 'none' ? 'hidden' : 'shown';
setTimeout(() => {
  // Added later by script: hidden through the generic ##.tark-generic-ad
  // once the collector reports the class.
  const ad = document.createElement('div');
  ad.className = 'tark-generic-ad';
  ad.textContent = 'a generic hide rule';
  document.body.appendChild(ad);
  setTimeout(() => {
    results.generic = getComputedStyle(ad).display === 'none' ? 'hidden' : 'shown';
    document.title = 'done:' + JSON.stringify(results);
  }, 4000);
}, 500);
</script>
