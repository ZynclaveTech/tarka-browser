<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speech test</title>
<button id="go" style="font-size:32px;padding:24px;width:100%">Listen</button>
<pre id="out" style="font-size:24px">idle</pre>
<script>
  const lang = new URLSearchParams(location.search).get('lang') || 'en-US';
  const out = document.getElementById('out');
  document.getElementById('go').onclick = () => {
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Recognition) { out.textContent = 'error: unsupported'; return; }
    const r = new Recognition();
    r.lang = lang;
    r.onresult = (e) => { out.textContent = 'result: ' + e.results[0][0].transcript; };
    r.onerror = (e) => { out.textContent = 'error: ' + e.error; };
    r.onend = () => { if (/^listening/.test(out.textContent)) out.textContent = 'error: ended'; };
    out.textContent = 'listening ' + lang;
    r.start();
  };
</script>
