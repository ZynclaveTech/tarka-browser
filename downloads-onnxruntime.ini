# ONNX Runtime, the inference engine of Tark's live captions (D4): the
# official macOS arm64 release, MIT licensed, signed by Microsoft (re-signed
# with Tark's identity when the app is signed). sign_and_package_app.sh copies
# lib/libonnxruntime.1.31.0.dylib into Tark.app (utils/install_onnxruntime.sh);
# components/tark_captions builds against include/ and dlopen()s the dylib.
[onnxruntime]
version = 1.31.0
url = https://github.com/microsoft/onnxruntime/releases/download/v%(version)s/onnxruntime-osx-arm64-%(version)s.tgz
download_filename = onnxruntime-osx-arm64-%(version)s.tgz
sha256 = 1031b36dd3bdaa8d976a6130d9cf2a05e9be320b93ae804f8427b91dc3432afc
output_path = third_party/tark_onnxruntime
strip_leading_dirs = onnxruntime-osx-arm64-%(version)s
